name: Frontend CI Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-check:
  runs-on: ubuntu-latest

  steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '18'

  - name: Install Dependencies
    run: npm install
    working-directory: ./frontend app3

  - name: Run Build Check
    run: npm run build
    working-directory: ./frontend app3
